name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy Cloudflare Worker and sync secrets
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL || vars.VITE_GOOGLE_SCRIPT_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping Worker deploy."
            echo "worker_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT=$(npx --yes wrangler@4 deploy 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://my-space-api\.[a-zA-Z0-9-]+\.workers\.dev' | head -n 1 || true)
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Could not determine deployed Cloudflare Worker URL from wrangler output."
            exit 1
          fi

          if [ -n "$TURSO_DATABASE_URL" ]; then
            printf '%s' "$TURSO_DATABASE_URL" | npx --yes wrangler@4 secret put TURSO_DATABASE_URL
          fi
          if [ -n "$TURSO_AUTH_TOKEN" ]; then
            printf '%s' "$TURSO_AUTH_TOKEN" | npx --yes wrangler@4 secret put TURSO_AUTH_TOKEN
          fi
          if [ -n "$GOOGLE_SCRIPT_URL" ]; then
            printf '%s' "$GOOGLE_SCRIPT_URL" | npx --yes wrangler@4 secret put GOOGLE_SCRIPT_URL
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker at $WORKER_URL"

  build:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc -p worker/tsconfig.json --noEmit

      - run: npm test

      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.deploy-worker.outputs.worker_url || secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL || vars.VITE_GOOGLE_SCRIPT_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
