<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
<defs>

  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
    <feOffset dx="0" dy="5" result="offset"/>
    <feFlood flood-color="#4A3728" flood-opacity="0.16" result="color"/>
    <feComposite in="color" in2="offset" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="groundBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="sheenBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>


    <radialGradient id="amberBottle" cx="30%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#F6C873"/>
      <stop offset="52%" stop-color="#D98B38"/>
      <stop offset="100%" stop-color="#9B531B"/>
    </radialGradient>
    <radialGradient id="dropperBulb" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="60%" stop-color="#DFD3C2"/>
      <stop offset="100%" stop-color="#B7A691"/>
    </radialGradient>
    <linearGradient id="woodCap" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E7C89E"/>
      <stop offset="60%" stop-color="#C69A64"/>
      <stop offset="100%" stop-color="#966D3E"/>
    </linearGradient>
    <radialGradient id="balmJar" cx="32%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="58%" stop-color="#EFE6D8"/>
      <stop offset="100%" stop-color="#CFC0AA"/>
    </radialGradient>
    <radialGradient id="sageLid" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#92C4AE"/>
      <stop offset="58%" stop-color="#5C8D78"/>
      <stop offset="100%" stop-color="#3C6453"/>
    </radialGradient>
  
</defs>

    <ellipse cx="64" cy="108" rx="43" ry="9" fill="#4A3728" fill-opacity="0.14" filter="url(#groundBlur)"/>
    <g filter="url(#softShadow)">
      <!-- Dropper rubber bulb -->
      <path d="M44 26 C44 17 48 13 53 13 C58 13 62 17 62 26 L62 34 L44 34 Z" fill="url(#dropperBulb)"/>
      <!-- Wooden collar -->
      <rect x="40" y="31" width="26" height="13" rx="5" fill="url(#woodCap)"/>
      <!-- Plump amber bottle -->
      <path d="M35 50 C35 45 41 42 53 42 C65 42 71 45 71 50 L75 63 C77 73 77 91 74 99 C72 104 65 106 53 106 C41 106 34 104 32 99 C29 91 29 73 31 63 Z" fill="url(#amberBottle)"/>
      <!-- Minimal cream label -->
      <rect x="38" y="64" width="30" height="26" rx="6" fill="#FAF5EC" opacity="0.92"/>
      <circle cx="53" cy="74" r="4.5" fill="#D98B38" opacity="0.55"/>
      <rect x="44" y="82" width="18" height="3" rx="1.5" fill="#D6C6B0"/>
      <!-- Specular clay sheen -->
      <path d="M37 56 C35 66 35 84 37 94" stroke="#FFF4D9" stroke-width="4.5" stroke-linecap="round" opacity="0.55" filter="url(#sheenBlur)"/>
    </g>
    <!-- Small cream balm jar -->
    <g filter="url(#softShadow)">
      <rect x="65" y="75" width="42" height="31" rx="12" fill="url(#balmJar)"/>
      <rect x="63" y="66" width="46" height="14" rx="7" fill="url(#sageLid)"/>
      <ellipse cx="86" cy="70" rx="16" ry="3.2" fill="#A9D4C0" opacity="0.55"/>
      <path d="M72 86 L72 97" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#sheenBlur)"/>
    </g>
  
</svg>
