<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
<defs>

  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
    <feOffset dx="0" dy="5" result="offset"/>
    <feFlood flood-color="#4A3728" flood-opacity="0.16" result="color"/>
    <feComposite in="color" in2="offset" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="groundBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="sheenBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>


    <linearGradient id="bookCover" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="55%" stop-color="#E9DEC9"/>
      <stop offset="100%" stop-color="#CDBCA2"/>
    </linearGradient>
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E67753"/>
      <stop offset="50%" stop-color="#D95D39"/>
      <stop offset="100%" stop-color="#A84023"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D17A"/>
      <stop offset="55%" stop-color="#E6B85C"/>
      <stop offset="100%" stop-color="#B98730"/>
    </linearGradient>
    <radialGradient id="eraser" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F6A28B"/>
      <stop offset="100%" stop-color="#CF5E43"/>
    </radialGradient>
  
</defs>

    <ellipse cx="64" cy="109" rx="42" ry="9" fill="#4A3728" fill-opacity="0.14" filter="url(#groundBlur)"/>
    <g filter="url(#softShadow)">
      <!-- Bottom page thickness -->
      <rect x="27" y="23" width="68" height="82" rx="14" fill="#D4C6B1"/>
      <!-- Page edge -->
      <rect x="30" y="26" width="64" height="75" rx="11" fill="#F9F4EA"/>
      <!-- Top cover -->
      <rect x="24" y="19" width="67" height="80" rx="14" fill="url(#bookCover)"/>
      <!-- Terracotta cloth spine -->
      <path d="M24 33 C24 25 30 19 38 19 L43 19 L43 99 L38 99 C30 99 24 93 24 85 Z" fill="url(#bookSpine)"/>
      <!-- Embossed cream label on cover -->
      <rect x="52" y="34" width="28" height="16" rx="5" fill="#FBF8F3"/>
      <rect x="57" y="40" width="18" height="3.2" rx="1.6" fill="#C9B9A3"/>
      <rect x="57" y="45" width="12" height="2.6" rx="1.3" fill="#D9CBB7"/>
      <!-- Hanging ribbon bookmark -->
      <path d="M62 96 L73 96 L73 114 L67.5 109 L62 114 Z" fill="#D95D39"/>
      <!-- Soft cover sheen -->
      <path d="M47 26 L83 26" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.7" filter="url(#sheenBlur)"/>
    </g>
    <!-- Diagonal rounded clay pencil -->
    <g transform="translate(88 64) rotate(32)" filter="url(#softShadow)">
      <rect x="-7" y="-32" width="14" height="52" rx="5" fill="url(#pencilBody)"/>
      <path d="M-7 17 L7 17 L0 33 Z" fill="#EBD0A7"/>
      <path d="M-2.6 26.5 L2.6 26.5 L0 33 Z" fill="#3B322C"/>
      <rect x="-7" y="-36" width="14" height="10" rx="4" fill="url(#eraser)"/>
      <rect x="-7" y="-28" width="14" height="5" rx="1.5" fill="#D4C7B4"/>
      <line x1="-2.5" y1="-20" x2="-2.5" y2="14" stroke="#FFF4D1" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
    </g>
  
</svg>
