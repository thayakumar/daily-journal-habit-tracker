<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
<defs>

  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
    <feOffset dx="0" dy="5" result="offset"/>
    <feFlood flood-color="#4A3728" flood-opacity="0.16" result="color"/>
    <feComposite in="color" in2="offset" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="groundBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="sheenBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>


    <linearGradient id="calStand" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#EBD0A7"/>
      <stop offset="60%" stop-color="#C89D67"/>
      <stop offset="100%" stop-color="#966C3C"/>
    </linearGradient>
    <linearGradient id="calPage" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#D7C8B5"/>
    </linearGradient>
    <radialGradient id="calHeader" cx="30%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#769CD2"/>
      <stop offset="55%" stop-color="#4A6FA5"/>
      <stop offset="100%" stop-color="#304C77"/>
    </radialGradient>
  
</defs>

    <ellipse cx="64" cy="109" rx="43" ry="9" fill="#4A3728" fill-opacity="0.14" filter="url(#groundBlur)"/>
    <g filter="url(#softShadow)">
      <!-- Oak tent stand back -->
      <path d="M24 98 L36 32 C38 25 43 22 50 22 L82 22 C89 22 94 25 96 32 L106 98 C107 103 103 106 98 106 L32 106 C27 106 23 103 24 98 Z" fill="url(#calStand)"/>
      <!-- Thick cream flip pad -->
      <rect x="25" y="30" width="78" height="71" rx="14" fill="url(#calPage)"/>
      <!-- Cobalt clay top band -->
      <path d="M25 44 C25 36 31 30 39 30 L89 30 C97 30 103 36 103 44 L103 52 L25 52 Z" fill="url(#calHeader)"/>
      <!-- Brass binder rings -->
      <rect x="41" y="20" width="9" height="21" rx="4.5" fill="#E6B85C"/>
      <rect x="78" y="20" width="9" height="21" rx="4.5" fill="#E6B85C"/>
      <rect x="43" y="22" width="3" height="12" rx="1.5" fill="#FFF1C7" opacity="0.7"/>
      <rect x="80" y="22" width="3" height="12" rx="1.5" fill="#FFF1C7" opacity="0.7"/>
      <!-- Tactile dot grid (abstract dates, zero text) -->
      <circle cx="43" cy="67" r="5" fill="#D5C7B6"/>
      <circle cx="57" cy="67" r="5" fill="#D5C7B6"/>
      <circle cx="71" cy="67" r="5" fill="#D95D39"/>
      <circle cx="85" cy="67" r="5" fill="#D5C7B6"/>
      <circle cx="43" cy="83" r="5" fill="#D5C7B6"/>
      <circle cx="57" cy="83" r="5" fill="#5C8D78"/>
      <circle cx="71" cy="83" r="5" fill="#D5C7B6"/>
      <circle cx="85" cy="83" r="5" fill="#D5C7B6"/>
    </g>
  
</svg>
