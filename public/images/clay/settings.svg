<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
<defs>

  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
    <feOffset dx="0" dy="5" result="offset"/>
    <feFlood flood-color="#4A3728" flood-opacity="0.16" result="color"/>
    <feComposite in="color" in2="offset" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="groundBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="sheenBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>


    <linearGradient id="boxLid" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F1D5AE"/>
      <stop offset="55%" stop-color="#D2A774"/>
      <stop offset="100%" stop-color="#A67A48"/>
    </linearGradient>
    <linearGradient id="boxBase" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#DEC098"/>
      <stop offset="60%" stop-color="#BC8F5C"/>
      <stop offset="100%" stop-color="#8B6235"/>
    </linearGradient>
    <radialGradient id="waxSeal" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#F38E6D"/>
      <stop offset="55%" stop-color="#D95D39"/>
      <stop offset="100%" stop-color="#9A371C"/>
    </radialGradient>
    <radialGradient id="keyGold" cx="30%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FCE4A3"/>
      <stop offset="58%" stop-color="#E6B85C"/>
      <stop offset="100%" stop-color="#AD7B24"/>
    </radialGradient>
  
</defs>

    <ellipse cx="64" cy="109" rx="44" ry="9" fill="#4A3728" fill-opacity="0.14" filter="url(#groundBlur)"/>
    <g filter="url(#softShadow)">
      <!-- Wooden box base -->
      <rect x="21" y="54" width="80" height="49" rx="13" fill="url(#boxBase)"/>
      <!-- Overhanging wooden lid -->
      <rect x="17" y="34" width="88" height="26" rx="11" fill="url(#boxLid)"/>
      <!-- Cream decorative ribbon strap -->
      <rect x="52" y="34" width="18" height="69" fill="#F8F2E7" opacity="0.88"/>
      <!-- Terracotta wax seal / clasp -->
      <circle cx="61" cy="60" r="13.5" fill="url(#waxSeal)"/>
      <circle cx="61" cy="60" r="8.5" stroke="#F8B8A2" stroke-width="1.8" opacity="0.65"/>
      <!-- Lid highlight -->
      <path d="M27 41 L92 41" stroke="#FFF4E0" stroke-width="3.5" stroke-linecap="round" opacity="0.55" filter="url(#sheenBlur)"/>
    </g>
    <!-- Miniature brass key resting on right -->
    <g transform="translate(97 86) rotate(24)" filter="url(#softShadow)">
      <circle cx="0" cy="-14" r="11" stroke="url(#keyGold)" stroke-width="5.5" fill="none"/>
      <rect x="-3" y="-4" width="6" height="27" rx="3" fill="url(#keyGold)"/>
      <rect x="2" y="10" width="7" height="4.5" rx="2" fill="url(#keyGold)"/>
      <rect x="2" y="17" width="5.5" height="4.5" rx="2" fill="url(#keyGold)"/>
    </g>
  
</svg>
